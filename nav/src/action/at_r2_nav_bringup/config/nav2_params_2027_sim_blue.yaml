controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: odometry
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    - PreciseApproach
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: pb_nav2_plugins/PreciseGoalChecker
      x_goal_tolerance: 0.07
      y_goal_tolerance: 0.07
      yaw_goal_tolerance: 0.07
      stable_duration: 0.1
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 30
      model_dt: 0.05
      batch_size: 3000
      vx_std: 0.45
      vy_std: 0.45
      wz_std: 0.35
      vx_max: 2.0
      vx_min: -2.0
      vy_max: 2.0
      wz_max: 3.5
      ax_max: 3.0
      ax_min: -3.0
      ay_min: -3.0
      ay_max: 3.0
      az_max: 4.0
      iteration_count: 2
      temperature: 0.3
      gamma: 0.035
      motion_model: Omni
      visualize: false
      critic_index_to_visualize: 0
      publish_optimal_trajectory: false
      reset_period: 1.0
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: mppi::DefaultOptimalTrajectoryValidator
        collision_lookahead_time: 0.5
        consider_footprint: true
      AckermannConstraints:
        min_turning_r: 0.0
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      - TwirlingCritic
      - VelocityDeadbandCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.5
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.15
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        critical_cost: 254.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 1
        threshold_to_consider: 0.3
        offset_from_furthest: 5
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 20
        threshold_to_consider: 1.5
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 0.1
        max_angle_to_furthest: 1.0
        mode: 0
      VelocityDeadbandCritic:
        enabled: false
        cost_power: 1
        cost_weight: 10.0
        deadband_velocities:
        - 0.05
        - 0.05
        - 0.05
      TwirlingCritic:
        enabled: false
        twirling_cost_power: 1
        twirling_cost_weight: 15.0
    PreciseApproach:
      plugin: pb_omni_pid_pursuit_controller::OmniPidPursuitController
      translation_x_kp: 3.0
      translation_x_ki: 0.3
      translation_x_kd: 1.5
      translation_y_kp: 5.0
      translation_y_ki: 0.3
      translation_y_kd: 2.5
      enable_rotation: true
      rotation_kp: 3.0
      rotation_ki: 0.1
      rotation_kd: 1.4
      transform_tolerance: 0.1
      min_max_sum_error: 2.0
      lookahead_dist: 1.0
      use_velocity_scaled_lookahead_dist: false
      lookahead_time: 1.0
      min_lookahead_dist: 0.001
      max_lookahead_dist: 0.5
      use_interpolation: true
      use_rotate_to_heading: false
      use_rotate_to_heading_treshold: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.01
      v_linear_min: -1.5
      v_linear_max: 1.5
      v_angular_min: -3.0
      v_angular_max: 3.0
      curvature_min: 0.4
      curvature_max: 0.7
      reduction_ratio_at_high_curvature: 0.5
      curvature_forward_dist: 0.3
      curvature_backward_dist: 0.2
      max_velocity_scaling_factor_rate: 0.9
      yaw_alignment_threshold: 0.3
      yaw_full_suppress_angle: 0.6
      velocity_smoothing_factor: 0.3
local_costmap:
