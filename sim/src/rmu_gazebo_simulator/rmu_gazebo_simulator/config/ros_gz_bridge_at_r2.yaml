# AT_R2 机器人专用桥接配置
# 使用 MecanumDrive2 插件（力控模式）

# ============================================
# 麦克纳姆轮驱动控制（MecanumDrive2 插件）
# ============================================
# MecanumDrive2 插件的话题格式: {model_name}/cmd_vel
- ros_topic_name: "/<robot_name>/cmd_vel_nav2_result"
  gz_topic_name: "/<robot_name>/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: "ROS_TO_GZ"

# ============================================
# 里程计反馈（MecanumDrive2 插件）
# ============================================
# MecanumDrive2 插件的里程计话题格式: {model_name}/odometry
- ros_topic_name: "/<robot_name>/odom"
  gz_topic_name: "/<robot_name>/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: "GZ_TO_ROS"

# ============================================
# 关节状态发布（用于监控轮子转速等）
# ============================================
- ros_topic_name: "/<robot_name>/joint_states"
  gz_topic_name: "/world/default/model/<robot_name>/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: "GZ_TO_ROS"

# ============================================
# TF 变换（用于 RViz2 可视化）- 已禁用，使用Point-LIO定位
# ============================================
# - ros_topic_name: "/<robot_name>/tf"
#   gz_topic_name: "/model/<robot_name>/tf"
#   ros_type_name: "tf2_msgs/msg/TFMessage"
#   gz_type_name: "gz.msgs.Pose_V"
#   direction: "GZ_TO_ROS"

# ============================================
# 爬台阶/下台阶控制（SimpleStairClimber 插件）
# ============================================
# 上楼梯控制
- ros_topic_name: "/<robot_name>/climb_stair"
  gz_topic_name: "/<robot_name>/climb_stair"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: "ROS_TO_GZ"

# 下楼梯控制
- ros_topic_name: "/<robot_name>/descend_stair"
  gz_topic_name: "/<robot_name>/descend_stair"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: "ROS_TO_GZ"

# 爬楼梯状态反馈
# 状态码: 0=IDLE(空闲), 1=RUNNING(执行中), 2=SUCCESS(成功), 3=FAILED(失败)
- ros_topic_name: "/<robot_name>/climber_status"
  gz_topic_name: "/<robot_name>/climber_status"
  ros_type_name: "std_msgs/msg/Int32"
  gz_type_name: "ignition.msgs.Int32"
  direction: "GZ_TO_ROS"

# ============================================
# 3D激光雷达（Livox Mid360）
# ============================================
# 点云数据
- ros_topic_name: "/<robot_name>/mid_360/lidar"
  gz_topic_name: "/world/default/model/<robot_name>/link/mid360/sensor/mid360_lidar/scan/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "ignition.msgs.PointCloudPacked"
  direction: "GZ_TO_ROS"

# IMU 数据
- ros_topic_name: "/<robot_name>/mid_360/imu"
  gz_topic_name: "/world/default/model/<robot_name>/link/mid360/sensor/mid360_imu/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "ignition.msgs.IMU"
  direction: "GZ_TO_ROS"

# ============================================
# 双目相机（Industrial Camera）
# ============================================
# 左相机图像
- ros_topic_name: "/<robot_name>/front_left_camera/image"
  gz_topic_name: "/world/default/model/<robot_name>/link/front_left_industrial_camera/sensor/front_left_industrial_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: "GZ_TO_ROS"

# 左相机信息
- ros_topic_name: "/<robot_name>/front_left_camera/camera_info"
  gz_topic_name: "/world/default/model/<robot_name>/link/front_left_industrial_camera/sensor/front_left_industrial_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: "GZ_TO_ROS"

# 右相机图像
- ros_topic_name: "/<robot_name>/front_right_camera/image"
  gz_topic_name: "/world/default/model/<robot_name>/link/front_right_industrial_camera/sensor/front_right_industrial_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: "GZ_TO_ROS"

# 右相机信息
- ros_topic_name: "/<robot_name>/front_right_camera/camera_info"
  gz_topic_name: "/world/default/model/<robot_name>/link/front_right_industrial_camera/sensor/front_right_industrial_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: "GZ_TO_ROS"

# ============================================
# 底盘IMU传感器
# ============================================
- ros_topic_name: "/<robot_name>/chassis/imu"
  gz_topic_name: "/world/default/model/<robot_name>/link/chassis/sensor/chassis_imu/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "ignition.msgs.IMU"
  direction: "GZ_TO_ROS"

# ============================================
# 模型真值位姿（仿真世界坐标系中的真实位置）
# ============================================
- ros_topic_name: "/<robot_name>/ground_truth/pose"
  gz_topic_name: "/world/default/dynamic_pose/info"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: "GZ_TO_ROS"

